name: Versuni
description: 'Versuni is a global domestic-appliances company headquartered in Amsterdam,
  Netherlands, formed when Philips Domestic Appliances was carved out and acquired by
  Hillhouse Investment in 2021. With more than 130 years of heritage, roughly 6,400
  employees and a presence in over 100 countries, Versuni designs and sells cooking,
  coffee, garment-care, floor-care and climate-care products under brands including
  Philips, Saeco, Gaggia, Preethi, Senseo and L''OR Barista. Its connected appliances
  are supported by the consumer HomeID app (formerly NutriU). Versuni publishes no
  public developer API program; its public API-adjacent surface is limited to an RFC
  9116 security.txt and a responsible-disclosure program.'
